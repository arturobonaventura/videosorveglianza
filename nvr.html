<!-- nvr.html -->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NVR Interface</title>
  <style>
    body { font-family: Arial; background:#111; color:white; padding:20px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
    .cam-box { background:#000; height:300px; border:2px solid #444; position:relative; }
    .label { position:absolute; top:5px; left:5px; background:rgba(0,0,0,0.5); padding:5px; }
    video { width:100%; height:100%; object-fit:cover; }
  </style>
</head>
<body>
  <h1>Videocamere</h1>
  <div class="grid">
    <div class="cam-box"><div class="label">Cam 1</div><video src="cam1.mp4" autoplay muted loop></video></div>
    <div class="cam-box"><div class="label">Cam 2</div><video src="cam2.mp4" autoplay muted loop></video></div>
    <div class="cam-box"><div class="label">Cam 3</div><video src="cam3.mp4" autoplay muted loop></video></div>
    <div class="cam-box"><div class="label">Cam 4</div><video src="cam4.mp4" autoplay muted loop></video></div>
  </div>
</body>
</html>
