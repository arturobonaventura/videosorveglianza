<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f2f2f2; display:flex; justify-content:center; align-items:center; height:100vh; }
    .login-box { background:#fff; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.3); width:300px; }
    input { width:100%; padding:10px; margin:10px 0; }
    button { width:100%; padding:10px; background:#0077cc; color:white; border:none; cursor:pointer; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Accesso</h2>
    <input type="text" id="user" placeholder="Username" />
    <input type="password" id="pass" placeholder="Password" />
    <button onclick="login()">Entra</button>
  </div>

<script>
function login(){
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;
  if(u==="admin" && p==="admin"){
    window.location.href = "nvr.html";
  } else {
    alert("Credenziali errate");
  }
}
</script>
</body>
</html>
